<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gender & Vote Eligibility</title>

<style>

body{
    background-color:#E3F2FD;
    font-family:Arial;
}

h2{
    color:#0D47A1;

form{
    width:300px;

    padding:20px;

    padding:10px;
    width:100%;
    font-size:16px;
    border-radius:5px;
}

input[type=submit]:hover{
    background-color:#1565C0;
}

</style>

</head>
<body>

<h2>Vote & Marriage Eligibility</h2>


</head>
<body>
	<form action="Gender_Vote">
		
		Age:
		<input type="number" name="age"> <br><br>
		
		Gender:
		<input type="radio" name="r" value="m"> Male
		<input type="radio" name="r" value="f"> Female
		
		<br><br>
		
		<input type="submit">
		
		
		
	</form>
